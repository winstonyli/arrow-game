<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Arrow Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  [hidden] { display: none !important; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(13, 17, 23, 0.75); color: #c9d1d9; }
  .overlay button { font-size: 18px; padding: 12px 20px; min-width: 320px; border: 1px solid #30363d; border-radius: 8px; background: #21262d; color: #c9d1d9; cursor: pointer; }
  .overlay button:hover { background: #30363d; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="picker" class="overlay" hidden></div>
<div id="over" class="overlay" hidden>
  <div id="over-text"></div>
  <button id="restart">Restart</button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
